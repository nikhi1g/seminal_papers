name: Create paper submission PR

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: paper-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  create-pull-request:
    if: startsWith(github.event.issue.title, '[Paper Submission] ') || startsWith(github.event.issue.title, '%5BPaper%20Submission%5D')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate submission and update JSON
        id: validate
        continue-on-error: true
        run: node .github/scripts/create-paper-submission.mjs

      - name: Report invalid submission
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALIDATION_ERROR: ${{ steps.validate.outputs.error }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --body "Validation failed: ${VALIDATION_ERROR:-Unknown validation error.}"

      - name: Stop invalid submission
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Build and validate proposed site
        run: node .github/scripts/build-site.mjs _site

      - name: Create submission branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUBMISSION_PATH: ${{ steps.validate.outputs.submission_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "paper-submission/issue-${ISSUE_NUMBER}"
          git add "${SUBMISSION_PATH}"
          git commit -m "data: add paper submission from issue ${ISSUE_NUMBER}"
          git push origin "paper-submission/issue-${ISSUE_NUMBER}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ steps.validate.outputs.issue_title }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "paper-submission/issue-${ISSUE_NUMBER}" \
            --title "${ISSUE_TITLE}" \
            --body "Adds the structured paper submission from #${ISSUE_NUMBER}. Review the title, destination, and metadata before merging. The site updates automatically after this pull request is merged.")
          gh issue comment "${ISSUE_NUMBER}" --body "Created ${PR_URL} for review. This submission is not live yet; merge the pull request to update the site."

      - name: Auto-merge submissions from the repo owner
        if: github.event.issue.user.login == 'nikhi1g'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr merge "paper-submission/issue-${ISSUE_NUMBER}" --squash --delete-branch
          gh issue comment "${ISSUE_NUMBER}" --body "Auto-merged since this submission was opened by the repo owner. The site will update shortly."

      - name: Deploy owner submissions
        if: github.event.issue.user.login == 'nikhi1g'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
